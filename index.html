<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Visualizador IFC</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

  <!-- ===================================================== topo ===== -->
  <header id="topbar">
    <div id="brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2 3 7v10l9 5 9-5V7l-9-5Z"/>
        <path d="M3 7l9 5 9-5"/>
        <path d="M12 12v10"/>
      </svg>
      <span>Visualizador IFC</span>
    </div>
    <span id="file-name"></span>
    <div class="topbar-spacer"></div>

    <button id="btn-open" class="btn btn-primary" title="Abrir arquivo IFC">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <path d="M17 8l-5-5-5 5"/>
        <path d="M12 3v12"/>
      </svg>
      Abrir IFC
    </button>

    <button id="btn-theme" class="icon-btn" title="Alternar tema claro/escuro">
      <svg id="icon-theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
      </svg>
      <svg id="icon-theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden">
        <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
      </svg>
    </button>

    <button id="btn-fullscreen" class="icon-btn" title="Tela cheia">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 3H5a2 2 0 0 0-2 2v3M16 3h3a2 2 0 0 1 2 2v3M8 21H5a2 2 0 0 1-2-2v-3M16 21h3a2 2 0 0 0 2-2v-3"/>
      </svg>
    </button>
  </header>

  <div id="main">

    <!-- ================================================= toolbar ===== -->
    <aside id="toolbar">
      <div class="tool-group">
        <button class="icon-btn" id="tool-home" title="Ajustar à janela (Home)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 10.5 12 3l9 7.5"/>
            <path d="M5 9.5V20a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1V9.5"/>
          </svg>
        </button>
        <button class="icon-btn" id="tool-pan" title="Alternar órbita / pan (botão esquerdo)">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2v20M2 12h20"/>
            <path d="m9 5 3-3 3 3M9 19l3 3 3-3M5 9l-3 3 3 3M19 9l3 3-3 3"/>
          </svg>
        </button>
      </div>

      <div class="tool-group">
        <button class="icon-btn" id="tool-wireframe" title="Modo wireframe">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2 3 7v10l9 5 9-5V7z"/>
            <path d="M3 7l9 5 9-5M12 12v10M3 7l4.5 8M21 7l-4.5 8M7.5 15h9"/>
          </svg>
        </button>
        <button class="icon-btn" id="tool-section" title="Plano de corte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12h18"/>
            <path d="M6 5 3 12l3 7M18 5l3 7-3 7"/>
          </svg>
        </button>
        <button class="icon-btn" id="tool-explode" title="Explodir por pavimento/grupo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="10" y="3" width="4" height="4"/>
            <rect x="3" y="17" width="4" height="4"/>
            <rect x="17" y="17" width="4" height="4"/>
            <path d="M12 7v4M12 11 5 17M12 11l7 6"/>
          </svg>
        </button>
        <button class="icon-btn" id="tool-measure" title="Medir distância">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="m3 21 18-18"/>
            <path d="m8 16 2 2M12 12l2 2M16 8l2 2"/>
          </svg>
        </button>
      </div>

      <div class="tool-group">
        <button class="icon-btn" id="tool-tree" title="Mostrar/ocultar árvore do modelo">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 4h6v6H4zM4 16h6v4H4zM14 4h6v4h-6zM14 12h6v8h-6zM10 7h4M7 10v6h3M17 8v4"/>
          </svg>
        </button>
        <button class="icon-btn" id="tool-reset" title="Mostrar todos os elementos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"/>
            <path d="M3 4v5h5"/>
          </svg>
        </button>
      </div>
    </aside>

    <!-- ================================================= viewport ===== -->
    <div id="viewport">
      <canvas id="viewer-canvas"></canvas>

      <div id="drop-hint">
        <div class="drop-card">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <path d="M17 8l-5-5-5 5"/>
            <path d="M12 3v12"/>
          </svg>
          <strong>Arraste um arquivo .ifc aqui</strong>
          ou clique em "Abrir IFC" no topo
        </div>
      </div>

      <div id="progress-overlay" class="hidden">
        <div id="progress-bar-track"><div id="progress-bar-fill"></div></div>
        <div id="progress-label">Carregando modelo…</div>
      </div>

      <div id="section-panel" class="floating-panel hidden">
        <label>Corte</label>
        <div class="axis-toggle">
          <button data-axis="x">X</button>
          <button data-axis="y">Y</button>
          <button data-axis="z" class="active">Z</button>
        </div>
        <input type="range" id="section-slider" min="0" max="100" value="100" />
        <button class="icon-btn" id="section-flip" title="Inverter lado do corte">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M17 3 21 7l-4 4M21 7H9a4 4 0 0 0-4 4v1M7 21l-4-4 4-4M3 17h12a4 4 0 0 0 4-4v-1"/>
          </svg>
        </button>
      </div>

      <div id="explode-panel" class="floating-panel hidden">
        <label>Explodir</label>
        <input type="range" id="explode-slider" min="0" max="100" value="0" />
      </div>

      <div id="measure-badge" class="hidden"></div>

      <div class="hint-text" id="hint-text">Botão esquerdo: girar · Botão direito: pan · Roda: zoom</div>
    </div>

    <!-- ================================================== sidebar ===== -->
    <aside id="sidebar">
      <div id="sidebar-tabs">
        <button data-tab="properties" class="active">Propriedades</button>
        <button data-tab="tree">Modelo</button>
      </div>

      <div id="tab-properties" class="tab-content active">
        <div id="properties-empty">Nenhum elemento selecionado.<br/>Clique em um elemento no modelo 3D ou na árvore para ver suas propriedades.</div>
        <div id="properties-content" class="hidden">
          <div id="prop-element-title"></div>
          <div id="prop-element-type"></div>
          <div id="prop-actions">
            <button id="prop-isolate" title="Isolar elemento selecionado">Isolar</button>
            <button id="prop-hide" title="Ocultar elemento selecionado">Ocultar</button>
            <button id="prop-clear" title="Limpar seleção">Limpar</button>
          </div>
          <div id="prop-groups"></div>
        </div>
      </div>

      <div id="tab-tree" class="tab-content">
        <div id="tree-root"></div>
      </div>
    </aside>

  </div>
</div>

<input type="file" id="file-input" accept=".ifc" class="hidden" />
<div id="toast" class="hidden"></div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.152.0/build/three.module.js",
    "three/examples/jsm/": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/",
    "three/examples/jsm/utils/BufferGeometryUtils": "https://cdn.jsdelivr.net/npm/three@0.152.0/examples/jsm/utils/BufferGeometryUtils.js",
    "web-ifc": "https://cdn.jsdelivr.net/npm/web-ifc@0.0.57/web-ifc-api.js",
    "web-ifc-three/IFCLoader": "https://cdn.jsdelivr.net/npm/web-ifc-three@0.0.126/IFCLoader.js"
  }
}
</script>
<script type="module" src="app.js"></script>

</body>
</html>
